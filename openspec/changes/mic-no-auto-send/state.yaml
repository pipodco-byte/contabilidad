change_description: |
  Fix: El Mic botón SOLO detiene la grabación, no envía automáticamente.
  El usuario tiene control total: revisa/edita en textarea y presiona Enter o Send.

  Flujo corregido:
  1. Felipe presiona Mic → startListening()
  2. Felipe habla → texto aparece en textarea (live)
  3. Felipe deja de hablar → auto-stop (mic se apaga)
  4. Texto queda en textarea para revisión
  5. Felipe edita si quiere
  6. Felipe presiona Enter o botón Send → SE ENVÍA

