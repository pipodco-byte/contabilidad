name: Release Please

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release-please.outputs.release_created }}
      pr-number: ${{ steps.release-please.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate Release PR
        id: release-please
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Enable auto-merge
        if: steps.release-please.outputs.pr-number != ''
        run: |
          gh pr merge --admin --squash ${{ steps.release-please.outputs.pr-number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
